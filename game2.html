<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Brick Breaker Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff007f, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: bold;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box span {
            color: #00ffcc;
        }

        canvas {
            background-color: #0d0d15;
            border: 2px solid #7000ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
            display: block;
            margin: 0 auto 15px auto;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7000ff);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Neon Brick Breaker</h1>
        
        <div class="scoreboard">
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div class="score-box">Nyawa: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="450"></canvas>

        <button class="btn" id="startBtn">Mulai Game</button>

        <div class="instructions">
            Gunakan Tombol Panah Kiri/Kanan (atau geser mouse/sentuh layar) untuk menggerakkan pemantul.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const livesElement = document.getElementById("lives");
        const startBtn = document.getElementById("startBtn");

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let animationId = null;

        // Properti Pemantul (Paddle)
        const paddleWidth = 80;
        const paddleHeight = 12;
        let paddleX = (canvas.width - paddleWidth) / 2;
        const paddleSpeed = 7;

        // Properti Bola
        let ballRadius = 7;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;

        // Properti Bata (Bricks)
        const brickRowCount = 4;
        const brickColumnCount = 6;
        const brickWidth = 55;
        const brickHeight = 18;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 20;

        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        // Kontrol Keyboard
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", keyDownHandler);
        document.addEventListener("keyup", keyUpHandler);
        canvas.addEventListener("mousemove", mouseMoveHandler);
        canvas.addEventListener("touchmove", touchMoveHandler, { passive: true });

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function touchMoveHandler(e) {
            const touchX = e.touches[0].clientX - canvas.offsetLeft;
            if (touchX > 0 && touchX < canvas.width) {
                paddleX = touchX - paddleWidth / 2;
            }
        }

        // Deteksi Tumbukan Bola & Bata
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 10;
                            scoreElement.innerText = score;

                            // Cek Menang
                            if (score === brickRowCount * brickColumnCount * 10) {
                                alert("SELAMAT, ANDA MENANG!");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffcc";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff007f";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        // Warna berbeda tiap baris bata
                        ctx.fillStyle = r === 0 ? "#ff3366" : r === 1 ? "#ff9900" : r === 2 ? "#33ccff" : "#99ff33";
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = ctx.fillStyle;
                        ctx.fill();
                        ctx.closePath();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Pantulan Dinding Kiri & Kanan
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }

            // Pantulan Dinding Atas
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            // Pantulan Pemantul atau Jatuh ke Bawah
            else if (y + dy > canvas.height - ballRadius - 10) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    // Efek sudut pantulan berdasarkan posisi bola mengenai pemantul
                    let hitPoint = x - (paddleX + paddleWidth / 2);
                    dx = hitPoint * 0.15;
                    dy = -dy;
                } else {
                    lives--;
                    livesElement.innerText = lives;
                    if (!lives) {
                        alert("GAME OVER");
                        document.location.reload();
                    } else {
                        x = canvas.width / 2;
                        y = canvas.height - 30;
                        dx = 3;
                        dy = -3;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            // Pergerakan Bola
            x += dx;
            y += dy;

            // Pergerakan Pemantul via Keyboard
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += paddleSpeed;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= paddleSpeed;
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(draw);
            }
        }

        function startGame() {
            if (!isPlaying) {
                isPlaying = true;
                startBtn.innerText = "Sedang Bermain...";
                startBtn.disabled = true;
                initBricks();
                draw();
            }
        }

        startBtn.addEventListener("click", startGame);

        // Tampilan Awal Canvas
        initBricks();
        drawBricks();
        drawPaddle();
        drawBall();
    </script>
</body>
</html>
