<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong Arcade Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050510, #180a3a, #09021a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            max-width: 440px;
            width: 100%;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff007f, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box span {
            color: #ff007f;
        }

        canvas {
            background-color: #030308;
            border: 2px solid #7000ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
            display: block;
            margin: 0 auto 15px auto;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7000ff);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Neon Pong Classic</h1>
        
        <div class="scoreboard">
            <div class="score-box">Komputer: <span id="compScore">0</span></div>
            <div class="score-box">Kamu: <span id="playerScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <button class="btn" id="startBtn">Mulai Game</button>

        <div class="instructions">
            Gunakan **Tombol Panah Kiri/Kanan** atau **Geser Mouse/Sentuh** untuk menggerakkan pemantul bawah.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const playerScoreElement = document.getElementById("playerScore");
        const compScoreElement = document.getElementById("compScore");
        const startBtn = document.getElementById("startBtn");

        let playerScore = 0;
        let compScore = 0;
        let isPlaying = false;
        let animationId = null;

        // Properti Bola
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 4,
            velocityX: 4,
            velocityY: 4
        };

        // Pemantul Pemain (Bawah)
        const player = {
            width: 80,
            height: 12,
            x: canvas.width / 2 - 40,
            y: canvas.height - 25
        };

        // Pemantul Komputer (Atas)
        const computer = {
            width: 80,
            height: 12,
            x: canvas.width / 2 - 40,
            y: 15
        };

        // Kontrol Keyboard
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === "d") rightPressed = true;
            if (e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key === "d") rightPressed = false;
            if (e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
        });

        // Kontrol Mouse / Sentuh
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            player.x = mouseX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        canvas.addEventListener("touchmove", (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }, { passive: true });

        function update() {
            // Gerakan Player via Keyboard
            if (rightPressed && player.x < canvas.width - player.width) {
                player.x += 6;
            } else if (leftPressed && player.x > 0) {
                player.x -= 6;
            }

            // AI Komputer sederhana mengikuti bola
            let compCenter = computer.x + computer.width / 2;
            if (compCenter < ball.x - 10) {
                computer.x += 3.5;
            } else if (compCenter > ball.x + 10) {
                computer.x -= 3.5;
            }
            if (computer.x < 0) computer.x = 0;
            if (computer.x > canvas.width - computer.width) computer.x = canvas.width - computer.width;

            // Pergerakan Bola
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Pantulan Dinding Kiri & Kanan
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.velocityX = -ball.velocityX;
            }

            // Cek Tabrakan Pemantul Komputer (Atas)
            if (
                ball.y - ball.radius <= computer.y + computer.height &&
                ball.x >= computer.x &&
                ball.x <= computer.x + computer.width
            ) {
                ball.velocityY = -ball.velocityY;
                ball.y = computer.y + computer.height + ball.radius;
            }

            // Cek Tabrakan Pemantul Player (Bawah)
            if (
                ball.y + ball.radius >= player.y &&
                ball.x >= player.x &&
                ball.x <= player.x + player.width
            ) {
                ball.velocityY = -ball.velocityY;
                ball.y = player.y - ball.radius;
                // Tambah kecepatan sedikit setiap kali dipukul player
                ball.velocityX *= 1.05;
                ball.velocityY *= 1.05;
            }

            // Skor Komputer (Bola jatuh ke bawah)
            if (ball.y > canvas.height) {
                compScore++;
                compScoreElement.innerText = compScore;
                resetBall();
            }

            // Skor Player (Bola jatuh ke atas)
            if (ball.y < 0) {
                playerScore++;
                playerScoreElement.innerText = playerScore;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = (Math.random() > 0.5 ? 1 : -1) * 4;
            ball.velocityY = (Math.random() > 0.5 ? 1 : -1) * 4;
        }

        function draw() {
            // Bersihkan Layar
            ctx.fillStyle = "#030308";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Garis Tengah Lapangan (Putus-putus)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gambar Pemantul Komputer (Atas)
            ctx.fillStyle = "#00ffcc";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffcc";
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);

            // Gambar Pemantul Player (Bawah)
            ctx.fillStyle = "#ff007f";
            ctx.shadowColor = "#ff007f";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Gambar Bola
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            playerScore = 0;
            compScore = 0;
            playerScoreElement.innerText = playerScore;
            compScoreElement.innerText = compScore;
            isPlaying = true;
            startBtn.style.display = "none";
            resetBall();
            gameLoop();
        }

        startBtn.addEventListener("click", startGame);

        // Tampilan awal canvas
        ctx.fillStyle = "#030308";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("Tekan 'Mulai Game'", canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
