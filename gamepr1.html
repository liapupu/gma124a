<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box span {
            color: #00ff87;
        }

        canvas {
            background-color: #111;
            border: 3px solid #60efff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(96, 239, 255, 0.3);
            display: block;
            margin: 0 auto 15px auto;
            max-width: 100%;
            height: auto;
        }

        .controls-panel {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: #ccc;
        }

        select {
            background: #222;
            color: #fff;
            border: 1px solid #60efff;
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Tombol Navigasi Layar (Mobile Friendly) */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 50px);
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }

        .m-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .m-btn:active {
            background: rgba(96, 239, 255, 0.3);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .instructions {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Neon Snake</h1>
        
        <div class="scoreboard">
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div class="score-box">Rekor: <span id="highScore">0</span></div>
        </div>

        <div class="controls-panel">
            <label for="difficulty">Level:</label>
            <select id="difficulty">
                <option value="120">Mudah</option>
                <option value="90" selected>Sedang</option>
                <option value="60">Sulit</option>
            </select>
        </div>

        <canvas id="gameCanvas" width="360" height="360"></canvas>

        <button class="btn" id="startBtn">Mulai Game</button>

        <!-- Tombol kontrol tambahan untuk HP/Tablet -->
        <div class="mobile-controls">
            <button class="m-btn btn-up" onclick="changeDirection('UP')">⬆️</button>
            <button class="m-btn btn-left" onclick="changeDirection('LEFT')">⬅️</button>
            <button class="m-btn btn-down" onclick="changeDirection('DOWN')">⬇️</button>
            <button class="m-btn btn-right" onclick="changeDirection('RIGHT')">➡️</button>
        </div>

        <div class="instructions">
            Gunakan Tombol Panah (Keyboard) atau tombol di atas untuk mengontrol ular.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const startBtn = document.getElementById("startBtn");
        const difficultySelect = document.getElementById("difficulty");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval = null;
        let isRunning = false;
        let changingDirection = false; // Mencegah bug dobel klik arah cepat

        highScoreElement.innerText = highScore;

        // Event Listener untuk keyboard
        document.addEventListener("keydown", handleKeyPress);

        function handleKeyPress(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const W = 87, A = 65, S = 83, D = 68;

            if (changingDirection) return;

            if ((keyPressed === LEFT || keyPressed === A) && dx === 0) {
                dx = -gridSize; dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === UP || keyPressed === W) && dy === 0) {
                dx = 0; dy = -gridSize;
                changingDirection = true;
            }
            if ((keyPressed === RIGHT || keyPressed === D) && dx === 0) {
                dx = gridSize; dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === DOWN || keyPressed === S) && dy === 0) {
                dx = 0; dy = gridSize;
                changingDirection = true;
            }
        }

        // Fungsi kontrol untuk tombol layar HP
        function changeDirection(direction) {
            if (changingDirection) return;
            if (direction === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; changingDirection = true; }
            if (direction === 'UP' && dy === 0) { dx = 0; dy = -gridSize; changingDirection = true; }
            if (direction === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; changingDirection = true; }
            if (direction === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; changingDirection = true; }
        }

        startBtn.addEventListener("click", resetGame);

        function resetGame() {
            snake = [
                { x: 160, y: 160 },
                { x: 140, y: 160 },
                { x: 120, y: 160 }
            ];
            score = 0;
            scoreElement.innerText = score;
            dx = gridSize;
            dy = 0;
            isRunning = true;
            startBtn.innerText = "Restart Game";
            difficultySelect.disabled = true;

            createFood();
            clearInterval(gameInterval);
            let speed = parseInt(difficultySelect.value);
            gameInterval = setInterval(gameLoop, speed);
        }

        function gameLoop() {
            if (hasGameEnded()) {
                endGame();
                return;
            }
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Kepala ular warna hijau neon, tubuh warna biru neon
                ctx.fillStyle = index === 0 ? "#00ff87" : "#60efff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = index === 0 ? "#00ff87" : "#60efff";
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; // Reset efek cahaya
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Cek apakah ular makan makanan
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                createFood();
            } else {
                snake.pop();
            }
        }

        function randomGridCoord() {
            return Math.floor(Math.random() * tileCount) * gridSize;
        }

        function createFood() {
            food.x = randomGridCoord();
            food.y = randomGridCoord();

            // Pastikan makanan tidak muncul di atas badan ular
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff3366";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff3366";
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }

        function hasGameEnded() {
            // Tabrakan dengan dinding
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) return true;

            // Tabrakan dengan tubuh sendiri
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function endGame() {
            clearInterval(gameInterval);
            isRunning = false;
            difficultySelect.disabled = false;
            startBtn.innerText = "Main Lagi";
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "bold 24px Segoe UI";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.font = "14px Segoe UI";
            ctx.fillStyle = "#ccc";
            ctx.fillText("Skor Akhir: " + score, canvas.width / 2, canvas.height / 2 + 20);
        }

        // Tampilan awal sebelum game dimulai
        clearCanvas();
        ctx.fillStyle = "white";
        ctx.font = "bold 18px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("Tekan 'Mulai Game'", canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
