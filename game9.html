<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Whack-a-Mole Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 440px;
            width: 100%;
        }

        h1 {
            font-size: 1.7rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff007f, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box span {
            color: #00ffcc;
        }

        /* Grid Lubang Permainan */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            justify-items: center;
        }

        .hole {
            width: 90px;
            height: 90px;
            background: #11111d;
            border: 3px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 8px 15px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        /* Karakter Tikus / Alien Neon */
        .mole {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff007f 30%, #7000ff 80%);
            border-radius: 50%;
            top: 100%;
            transition: top 0.15s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 15px #ff007f;
        }

        .hole.up .mole {
            top: 0;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7000ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Neon Whack-a-Mole</h1>
        
        <div class="scoreboard">
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div class="score-box">Waktu: <span id="timeLeft">30</span>s</div>
            <div class="score-box">Rekor: <span id="highScore">0</span></div>
        </div>

        <div class="grid" id="grid">
            <div class="hole" id="hole-0"><div class="mole">👾</div></div>
            <div class="hole" id="hole-1"><div class="mole">👾</div></div>
            <div class="hole" id="hole-2"><div class="mole">👾</div></div>
            <div class="hole" id="hole-3"><div class="mole">👾</div></div>
            <div class="hole" id="hole-4"><div class="mole">👾</div></div>
            <div class="hole" id="hole-5"><div class="mole">👾</div></div>
            <div class="hole" id="hole-6"><div class="mole">👾</div></div>
            <div class="hole" id="hole-7"><div class="mole">👾</div></div>
            <div class="hole" id="hole-8"><div class="mole">👾</div></div>
        </div>

        <button class="btn" id="startBtn">Mulai Game</button>

        <div class="instructions">
            Klik atau sentuh monster neon (👾) secepat mungkin sebelum mereka bersembunyi!
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreElement = document.getElementById('score');
        const timeLeftElement = document.getElementById('timeLeft');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let timeLeft = 30;
        let gameTimer = null;
        let moleTimer = null;
        let lastHole = null;
        let isPlaying = false;
        let highScore = localStorage.getItem('moleHighScore') || 0;

        highScoreElement.innerText = highScore;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const index = Math.floor(Math.random() * holes.length);
            const hole = holes[index];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function showMole() {
            if (!isPlaying) return;
            const time = randomTime(500, 1000); // Waktu muncul monster
            const hole = randomHole(holes);
            
            hole.classList.add('up');

            setTimeout(() => {
                hole.classList.remove('up');
                if (isPlaying) {
                    showMole();
                }
            }, time);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreElement.innerText = score;
            timeLeftElement.innerText = timeLeft;
            isPlaying = true;
            startBtn.style.display = 'none';

            showMole();

            gameTimer = setInterval(() => {
                timeLeft--;
                timeLeftElement.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    isPlaying = false;
                    
                    // Cek High Score
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;
                        localStorage.setItem('moleHighScore', highScore);
                    }

                    startBtn.style.display = 'block';
                    startBtn.innerText = 'Main Lagi';
                }
            }, 1000);
        }

        // Deteksi pukulan (klik/sentuh) pada monster
        holes.forEach(hole => {
            const mole = hole.querySelector('.mole');
            mole.addEventListener('click', () => {
                if (!isPlaying || !hole.classList.contains('up')) return;
                score += 10;
                scoreElement.innerText = score;
                hole.classList.remove('up'); // Langsung sembunyikan setelah dipukul
            });
        });

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
