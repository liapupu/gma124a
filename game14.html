
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Space Battle</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050816;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
}

h1 {
  margin: 15px 0;
  color: #00f7ff;
  text-shadow: 0 0 15px #00eaff;
}

#game {
  display: block;
  margin: auto;
  background: linear-gradient(#080d2b,#14082a);
  border: 2px solid #00eaff;
  box-shadow: 0 0 20px #00eaff;
  max-width: 100%;
  touch-action: none;
}

.info {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  font-size: 17px;
}

button {
  background: #00eaff;
  color: #001018;
  border: none;
  padding: 13px 25px;
  margin: 8px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #00eaff;
}

button:active {
  transform: scale(.9);
}

#overlay {
  position: fixed;
  inset: 0;
  background: #050816dd;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 5;
}

#overlay h2 {
  font-size: 35px;
  color: #00eaff;
  margin-bottom: 15px;
  text-shadow: 0 0 15px #00eaff;
}

#controls {
  margin-top: 10px;
}

#controls button {
  width: 75px;
  height: 55px;
  font-size: 23px;
  padding: 5px;
}
</style>
</head>

<body>

<h1>🚀 NEON SPACE BATTLE</h1>

<div class="info">
  <span>⭐ Score: <b id="score">0</b></span>
  <span>❤️ Nyawa: <b id="life">3</b></span>
  <span>🏆 Level: <b id="level">1</b></span>
</div>

<canvas id="game" width="400" height="550"></canvas>

<div id="controls">
  <button id="left">⬅️</button>
  <button id="shoot">🔥</button>
  <button id="right">➡️</button>
</div>

<div id="overlay">
  <h2>NEON SPACE</h2>
  <p>Siap untuk menyelamatkan galaksi?</p>
  <p style="margin:15px">Hancurkan semua musuh!</p>
  <button onclick="startGame()">▶ MULAI GAME</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const lifeText = document.getElementById("life");
const levelText = document.getElementById("level");
const overlay = document.getElementById("overlay");

let player, bullets, enemies, stars;
let score = 0;
let life = 3;
let level = 1;
let running = false;
let keys = {};
let enemyTimer = 0;
let shootTimer = 0;
let animation;

function init() {
  player = {
    x: 180,
    y: 470,
    w: 35,
    h: 35,
    speed: 5
  };

  bullets = [];
  enemies = [];

  stars = Array.from({length: 70}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: Math.random() * 2 + 0.5,
    size: Math.random() * 2 + 1
  }));
}

function drawPlayer() {
  ctx.save();
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#00eaff";

  ctx.fillStyle = "#00eaff";
  ctx.beginPath();
  ctx.moveTo(player.x + 17, player.y);
  ctx.lineTo(player.x + 35, player.y + 35);
  ctx.lineTo(player.x + 17, player.y + 27);
  ctx.lineTo(player.x, player.y + 35);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(player.x + 14, player.y + 20, 7, 10);

  ctx.restore();
}

function drawStars() {
  ctx.fillStyle = "white";

  stars.forEach(s => {
    ctx.globalAlpha = Math.random() * 0.5 + 0.5;
    ctx.fillRect(s.x, s.y, s.size, s.size);

    s.y += s.speed;

    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  });

  ctx.globalAlpha = 1;
}

function shoot() {
  bullets.push({
    x: player.x + 15,
    y: player.y,
    speed: 8
  });
}

function spawnEnemy() {
  enemies.push({
    x: Math.random() * 360,
    y: -40,
    size: 30,
    speed: 2 + level * 0.4
  });
}

function drawBullets() {
  ctx.fillStyle = "#00ffff";
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00ffff";

  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y, 6, 15);
    b.y -= b.speed;
  });

  bullets = bullets.filter(b => b.y > -20);

  ctx.shadowBlur = 0;
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff2266";
    ctx.fillStyle = "#ff2266";

    ctx.beginPath();
    ctx.moveTo(e.x + 15, e.y);
    ctx.lineTo(e.x + 30, e.y + 15);
    ctx.lineTo(e.x + 15, e.y + 30);
    ctx.lineTo(e.x, e.y + 15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillRect(e.x + 8, e.y + 12, 5, 5);
    ctx.fillRect(e.x + 18, e.y + 12, 5, 5);

    e.y += e.speed;
  });

  ctx.shadowBlur = 0;
}

function collision(a, b) {
  return a.x < b.x + b.size &&
         a.x + 6 > b.x &&
         a.y < b.y + b.size &&
         a.y + 15 > b.y;
}

function update() {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawStars();

  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed;
  }

  player.x = Math.max(0, Math.min(365, player.x));

  if (keys[" "] || keys["shoot"]) {
    if (shootTimer <= 0) {
      shoot();
      shootTimer = 13;
    }
  }

  shootTimer--;
  enemyTimer++;

  if (enemyTimer > Math.max(15, 55 - level * 4)) {
    spawnEnemy();
    enemyTimer = 0;
  }

  drawPlayer();
  drawBullets();
  drawEnemies();

  // Tembakan mengenai musuh
  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (collision(b, e)) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score += 10;
        scoreText.textContent = score;

        level = Math.floor(score / 100) + 1;
        levelText.textContent = level;
      }
    });
  });

  // Musuh mencapai bawah
  enemies.forEach((e, i) => {
    if (e.y > canvas.height) {
      enemies.splice(i, 1);
      life--;
      lifeText.textContent = life;

      if (life <= 0) {
        gameOver();
      }
    }

    // Musuh menabrak pemain
    if (
      e.x < player.x + player.w &&
      e.x + e.size > player.x &&
      e.y < player.y + player.h &&
      e.y + e.size > player.y
    ) {
      enemies.splice(i, 1);
      life--;
      lifeText.textContent = life;

      if (life <= 0) gameOver();
    }
  });

  animation = requestAnimationFrame(update);
}

function startGame() {
  cancelAnimationFrame(animation);

  score = 0;
  life = 3;
  level = 1;

  scoreText.textContent = score;
  lifeText.textContent = life;
  levelText.textContent = level;

  init();

  overlay.style.display = "none";
  running = true;

  update();
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animation);

  overlay.innerHTML = `
    <h2>GAME OVER!</h2>
    <p>Skor kamu: ${score}</p>
    <p>Level: ${level}</p>
    <button onclick="startGame()">🔄 MAIN LAGI</button>
  `;

  overlay.style.display = "flex";
}

// Keyboard
document.addEventListener("keydown", e => {
  keys[e.key] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

// Kontrol HP
function holdButton(id, key) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => {
      keys[key] = false;
    });
  });
}

holdButton("left", "ArrowLeft");
holdButton("right", "ArrowRight");
holdButton("shoot", "shoot");

init();
</script>

</body>
</html>
